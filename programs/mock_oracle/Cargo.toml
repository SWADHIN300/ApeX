[package]
name = "mock_oracle"
version = "0.1.0"
description = "Mock Pyth-layout oracle for devnet ApeX"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_oracle"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]

[dependencies]
solana-program = "2.1.0"

# Use the portable implementation for host tests on Windows, where the default
# BLAKE3 assembly build expects a 64-bit GCC toolchain.
[target.'cfg(not(target_os = "solana"))'.dependencies]
blake3 = { version = "1.5.5", features = ["pure"] }
